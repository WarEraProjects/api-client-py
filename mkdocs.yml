site_name: WarEra API Client
site_description: Type-safe Python SDK for the WarEra Game API
site_url: https://warera-india.github.io/api-client-py/
repo_url: https://github.com/warera-india/api-client-py
repo_name: warera-india/api-client-py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Introduction: introduction.md
  - Getting Started: getting-started.md
  - Guides:
      - Advanced Usage: advanced-usage.md
      - Code Snippets: code-snippets.md
      - FAQ: faq.md
  - Reference:
      - API Reference: reference/index.md
      - Migration Guide: migration-guide.md
