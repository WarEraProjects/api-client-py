name: Generate Wiki

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to generate Wiki for'
        required: true
        default: 'version-0.2.2'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic httpx
          
      - name: Setup Git identity
        run: |
          git config --global user.name "GitHub Action Wiki Bot"
          git config --global user.email "action@github.com"
          
      - name: Generate and Push Wiki
        run: |
          # Generate the wiki files (the python script clones the wiki locally, and we can push directly to it if we use the implicit GITHUB_TOKEN)
          # We need to pass the GITHUB_TOKEN so the script can push to the wiki repo.
          # We'll just run the script which creates the files, then we push them.
          # The script clones the wiki via HTTPS. We can change the origin to use the token.
          
          # We will just run the script, which sets up the local clone.
          python scripts/generate_wiki.py
          
          cd scripts/api-client-py.wiki
          
          # Update the remote URL to include the token for authentication
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
          
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: Auto-generate wiki for branch ${{ github.event.inputs.branch }}" && git push)
