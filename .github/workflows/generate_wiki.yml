name: Generate Wiki

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to generate Wiki for'
        required: true
        default: 'version-0.2.2'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic httpx
          
      - name: Setup Git identity
        run: |
          git config --global user.name "GitHub Action Wiki Bot"
          git config --global user.email "action@github.com"
          
      - name: Generate and Push Wiki
        run: |
          # Clone the wiki repository securely using the GITHUB_TOKEN
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git scripts/api-client-py.wiki || echo "Wiki repository may not exist yet or clone failed"
          
          python scripts/generate_wiki.py
          
          cd scripts/api-client-py.wiki
          
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: Auto-generate wiki for branch ${{ github.event.inputs.branch }}" && git push)
